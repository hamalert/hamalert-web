# Development Apache config for the HamAlert web app.
#
# In production, the app is served from behind a webserver whose *root-level*
# URL rewrite (extensionless routes like /triggers -> triggers.php,
# /help -> help.php, /login -> login.php, ...) lives in server config that is
# NOT part of this repo. This file reproduces that rewrite for local dev, so
# that the app behaves the same way here as it does in production and under
# `php -S 127.0.0.1:8081 tools/router.php`.
#
# The rewrite rule below is deliberately byte-for-byte the same pattern as
# ajax/.htaccess (which is committed and handles the /ajax/* equivalent):
#
#   RewriteRule ^([a-zA-Z0-9_]+)$ $1.php [L]
#
# It matches a single path segment made of letters/digits/underscore only —
# no slashes — so it only ever fires for top-level routes (/triggers,
# /login, /help, ...), never for nested paths like /ajax/trigger_update
# (those are left alone here and handled by ajax/.htaccess once Apache's
# directory walk reaches ajax/, exactly like tools/router.php's own two-tier
# "root vs /dir/file" logic).
#
# AllowOverride All is required here for two reasons:
#   1. It lets ajax/.htaccess (and the ExpiresActive directives in
#      css/.htaccess, js/.htaccess, fonts/.htaccess) take effect at all.
#   2. mod_rewrite's per-directory context (which <Directory> blocks share
#      with .htaccess) strips the directory prefix before matching, so the
#      pattern above can be written exactly like ajax/.htaccess without
#      needing a leading slash or a RewriteBase.
<Directory /var/www/html>
	Options FollowSymLinks
	AllowOverride All
	Require all granted

	RewriteEngine On

	# Only rewrite when the request does NOT already map to a real file or
	# directory. This is what keeps static assets (css/, js/, images/,
	# fonts/, myspot_media/) and real subdirectories (ajax/, api/, vendor/,
	# tools/) working normally instead of being (mis)rewritten to "*.php":
	#   - /css/style.css and /js/triggers.js are existing files -> !-f fails
	#     -> rule skipped -> served as static files.
	#   - /ajax and /ajax/trigger_update contain a "/" -> the pattern below
	#     never matches them in the first place.
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule ^([a-zA-Z0-9_]+)$ $1.php [L]
</Directory>
